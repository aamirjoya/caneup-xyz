<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Gradients -->
    <radialGradient id="sunburst" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="emeraldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#0f5132"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f5132"/>
      <stop offset="30%" stop-color="#15803d"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#0f5132"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="tractorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="caneStalkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background: Pure White Canvas -->
  <rect width="1000" height="1000" fill="#ffffff"/>

  <!-- Master Emblem Group -->
  <g id="master-emblem" filter="url(#drop)">
    
    <!-- Outer Gold Ring -->
    <circle cx="500" cy="480" r="440" fill="url(#goldRim)"/>
    
    <!-- Outer Emerald Ring with beaded pattern -->
    <circle cx="500" cy="480" r="418" fill="url(#emeraldRim)"/>
    
    <!-- Inner Gold Accent Ring -->
    <circle cx="500" cy="480" r="392" fill="none" stroke="url(#goldRim)" stroke-width="5"/>
    <circle cx="500" cy="480" r="384" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.7"/>

    <!-- Emblem Inner Sky Center -->
    <circle cx="500" cy="480" r="380" fill="url(#sunburst)"/>

    <!-- Clip Path for Inside the Circle -->
    <clipPath id="circleClip">
      <circle cx="500" cy="480" r="380"/>
    </clipPath>

    <g clip-path="url(#circleClip)">
      <!-- Radiant Sun Rays -->
      <g opacity="0.25" stroke="#f59e0b" stroke-width="2">
        <line x1="500" y1="420" x2="500" y2="100"/>
        <line x1="500" y1="420" x2="650" y2="130"/>
        <line x1="500" y1="420" x2="780" y2="220"/>
        <line x1="500" y1="420" x2="850" y2="350"/>
        <line x1="500" y1="420" x2="860" y2="480"/>
        <line x1="500" y1="420" x2="350" y2="130"/>
        <line x1="500" y1="420" x2="220" y2="220"/>
        <line x1="500" y1="420" x2="150" y2="350"/>
        <line x1="500" y1="420" x2="140" y2="480"/>
      </g>

      <!-- Golden Rising Sun -->
      <circle cx="500" cy="410" r="115" fill="url(#sunGlow)"/>

      <!-- Distant Rolling Farmland Hills -->
      <path d="M 120 520 Q 310 440 500 480 Q 690 520 880 460 L 880 620 L 120 620 Z" fill="#86efac" opacity="0.6"/>
      <path d="M 120 540 Q 350 490 580 530 Q 750 490 880 520 L 880 650 L 120 650 Z" fill="#4ade80" opacity="0.7"/>

      <!-- Sugarcane Stalks in Background Left & Right -->
      <!-- Left Sugarcane -->
      <path d="M 210 550 Q 230 350 250 260" stroke="url(#caneStalkGrad)" stroke-width="7" fill="none"/>
      <path d="M 230 350 Q 180 320 160 360" stroke="#16a34a" stroke-width="3" fill="none"/>
      <path d="M 240 300 Q 290 270 320 300" stroke="#22c55e" stroke-width="3" fill="none"/>
      <!-- Right Sugarcane -->
      <path d="M 790 550 Q 770 350 750 260" stroke="url(#caneStalkGrad)" stroke-width="7" fill="none"/>
      <path d="M 770 350 Q 820 320 840 360" stroke="#16a34a" stroke-width="3" fill="none"/>
      <path d="M 760 300 Q 710 270 680 300" stroke="#22c55e" stroke-width="3" fill="none"/>

      <!-- Foreground Lush Crop Field -->
      <path d="M 120 560 Q 500 520 880 560 L 880 860 L 120 860 Z" fill="url(#fieldGrad)"/>

      <!-- Detailed Tractor with Farmer Centered in Sunrise -->
      <g id="emblem-tractor" transform="translate(340, 365)">
        <!-- Farmer Silhouette with Pagri/Turban -->
        <circle cx="100" cy="85" r="16" fill="#1e293b"/>
        <path d="M 85 80 Q 100 65 115 80 Q 125 90 100 95 Q 75 90 85 80 Z" fill="#ea580c"/> <!-- Saffron Turban -->
        <path d="M 90 98 L 115 98 L 126 135 L 140 125 L 146 132 L 130 152 L 105 155 L 85 142 Z" fill="#1e293b"/>
        <!-- Steering Wheel -->
        <line x1="145" y1="126" x2="138" y2="148" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="144" cy="124" rx="14" ry="5" fill="none" stroke="#f8fafc" stroke-width="4.5" transform="rotate(-30 144 124)"/>

        <!-- Tractor Hood / Chassis -->
        <path d="M 145 155 L 265 155 C 275 155, 280 160, 280 170 L 280 225 L 145 225 Z" fill="#16a34a"/>
        <path d="M 145 160 L 265 160 C 272 160, 276 164, 276 172 L 276 195 L 145 195 Z" fill="#22c55e" opacity="0.4"/>
        <line x1="275" y1="170" x2="275" y2="220" stroke="#f8fafc" stroke-width="3"/>
        <line x1="268" y1="170" x2="268" y2="220" stroke="#f8fafc" stroke-width="2"/>
        <line x1="261" y1="170" x2="261" y2="220" stroke="#f8fafc" stroke-width="2"/>

        <!-- Chrome Exhaust Pipe -->
        <rect x="235" y="75" width="8" height="80" rx="3" fill="#e2e8f0"/>
        <path d="M 233 75 Q 239 66 248 76" stroke="#e2e8f0" stroke-width="3" fill="none" stroke-linecap="round"/>

        <!-- Chrome Air Cleaner -->
        <rect x="252" y="125" width="6" height="30" fill="#94a3b8"/>
        <ellipse cx="255" cy="124" rx="8" ry="5" fill="#e2e8f0"/>

        <!-- Headlight Bright Beam -->
        <polygon points="280,180 340,165 340,210 280,195" fill="#fef08a" opacity="0.35"/>
        <ellipse cx="280" cy="188" rx="4" ry="7" fill="#fef08a"/>

        <!-- Seat & Rear Fender -->
        <path d="M 80 155 C 70 130, 90 115, 110 145 Z" fill="#1e293b"/>
        <path d="M 25 210 C 20 135, 80 108, 135 125 L 130 140 C 85 125, 40 148, 42 210 Z" fill="#15803d"/>

        <!-- Large Rear Tire -->
        <g id="emblem-rear-tire" transform="translate(85, 208)">
          <circle cx="0" cy="0" r="68" fill="#1e293b"/>
          <circle cx="0" cy="0" r="50" fill="#f8fafc"/>
          <circle cx="0" cy="0" r="46" fill="#f59e0b"/>
          <circle cx="0" cy="0" r="24" fill="#1e293b"/>
          <circle cx="0" cy="0" r="10" fill="#f8fafc"/>
          <!-- Lugs -->
          <path d="M -10 -68 L 0 -56 L 10 -68 Z" fill="#f8fafc"/>
          <path d="M -10 -68 L 0 -56 L 10 -68 Z" fill="#f8fafc" transform="rotate(30)"/>
          <path d="M -10 -68 L 0 -56 L 10 -68 Z" fill="#f8fafc" transform="rotate(60)"/>
          <path d="M -10 -68 L 0 -56 L 10 -68 Z" fill="#f8fafc" transform="rotate(90)"/>
          <path d="M -10 -68 L 0 -56 L 10 -68 Z" fill="#f8fafc" transform="rotate(120)"/>
          <path d="M -10 -68 L 0 -56 L 10 -68 Z" fill="#f8fafc" transform="rotate(150)"/>
          <path d="M -10 -68 L 0 -56 L 10 -68 Z" fill="#f8fafc" transform="rotate(180)"/>
          <path d="M -10 -68 L 0 -56 L 10 -68 Z" fill="#f8fafc" transform="rotate(210)"/>
          <path d="M -10 -68 L 0 -56 L 10 -68 Z" fill="#f8fafc" transform="rotate(240)"/>
          <path d="M -10 -68 L 0 -56 L 10 -68 Z" fill="#f8fafc" transform="rotate(270)"/>
          <path d="M -10 -68 L 0 -56 L 10 -68 Z" fill="#f8fafc" transform="rotate(300)"/>
          <path d="M -10 -68 L 0 -56 L 10 -68 Z" fill="#f8fafc" transform="rotate(330)"/>
        </g>

        <!-- Front Wheel -->
        <g id="emblem-front-tire" transform="translate(258, 226)">
          <circle cx="0" cy="0" r="40" fill="#1e293b"/>
          <circle cx="0" cy="0" r="28" fill="#f8fafc"/>
          <circle cx="0" cy="0" r="25" fill="#f59e0b"/>
          <circle cx="0" cy="0" r="12" fill="#1e293b"/>
          <circle cx="0" cy="0" r="6" fill="#f8fafc"/>
        </g>
      </g>

      <!-- Foreground Grass Blades overlapping tractor bottom -->
      <path d="M 120 600 
               L 150 560 L 170 595 L 200 550 L 220 595 L 260 555 L 280 595
               L 320 550 L 340 595 L 380 555 L 410 595 L 450 550 L 480 595
               L 520 555 L 550 595 L 590 550 L 620 595 L 660 555 L 690 595
               L 730 550 L 760 595 L 800 555 L 830 595 L 860 560 L 880 600 Z" 
            fill="#15803d"/>
    </g>

    <!-- WREATH: Symmetrical Golden Wheat Stalks Framing Left & Right -->
    <!-- Left Golden Wheat Wreath -->
    <g id="left-wreath" transform="translate(0, 0)">
      <path d="M 230 730 C 140 600, 140 360, 260 210 C 310 150, 390 115, 480 100" 
            stroke="url(#goldRim)" stroke-width="7" fill="none" stroke-linecap="round"/>
      
      <!-- Wheat pairs along curve -->
      <g transform="translate(200, 580) rotate(-40)">
        <path d="M0,0 C-12,-8 -22,-20 -20,-32 C-14,-32 -2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M-20,-32 Q-35,-55 -45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        <path d="M0,0 C12,-8 22,-20 20,-32 C14,-32 2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M20,-32 Q35,-55 45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      </g>
      <g transform="translate(175, 480) rotate(-20)">
        <path d="M0,0 C-12,-8 -22,-20 -20,-32 C-14,-32 -2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M-20,-32 Q-35,-55 -45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        <path d="M0,0 C12,-8 22,-20 20,-32 C14,-32 2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M20,-32 Q35,-55 45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      </g>
      <g transform="translate(180, 380) rotate(5)">
        <path d="M0,0 C-12,-8 -22,-20 -20,-32 C-14,-32 -2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M-20,-32 Q-35,-55 -45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        <path d="M0,0 C12,-8 22,-20 20,-32 C14,-32 2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M20,-32 Q35,-55 45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      </g>
      <g transform="translate(210, 285) rotate(30)">
        <path d="M0,0 C-12,-8 -22,-20 -20,-32 C-14,-32 -2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M-20,-32 Q-35,-55 -45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        <path d="M0,0 C12,-8 22,-20 20,-32 C14,-32 2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M20,-32 Q35,-55 45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      </g>
      <g transform="translate(275, 205) rotate(55)">
        <path d="M0,0 C-12,-8 -22,-20 -20,-32 C-14,-32 -2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M-20,-32 Q-35,-55 -45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        <path d="M0,0 C12,-8 22,-20 20,-32 C14,-32 2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M20,-32 Q35,-55 45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      </g>
      <g transform="translate(365, 145) rotate(75)">
        <path d="M0,0 C-12,-8 -22,-20 -20,-32 C-14,-32 -2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M-20,-32 Q-35,-55 -45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        <path d="M0,0 C12,-8 22,-20 20,-32 C14,-32 2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M20,-32 Q35,-55 45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      </g>
      <g transform="translate(460, 110) rotate(95)">
        <path d="M0,0 C-10,-6 -18,-16 -16,-26 C-12,-26 -2,-16 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M-16,-26 Q-30,-45 -40,-65" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        <path d="M0,0 C10,-6 18,-16 16,-26 C12,-26 2,-16 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M16,-26 Q30,-45 40,-65" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      </g>
    </g>

    <!-- Right Golden Wheat Wreath (Mirrored Symmetrically) -->
    <g id="right-wreath" transform="translate(1000, 0) scale(-1, 1)">
      <path d="M 230 730 C 140 600, 140 360, 260 210 C 310 150, 390 115, 480 100" 
            stroke="url(#goldRim)" stroke-width="7" fill="none" stroke-linecap="round"/>
      
      <g transform="translate(200, 580) rotate(-40)">
        <path d="M0,0 C-12,-8 -22,-20 -20,-32 C-14,-32 -2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M-20,-32 Q-35,-55 -45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        <path d="M0,0 C12,-8 22,-20 20,-32 C14,-32 2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M20,-32 Q35,-55 45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      </g>
      <g transform="translate(175, 480) rotate(-20)">
        <path d="M0,0 C-12,-8 -22,-20 -20,-32 C-14,-32 -2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M-20,-32 Q-35,-55 -45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        <path d="M0,0 C12,-8 22,-20 20,-32 C14,-32 2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M20,-32 Q35,-55 45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      </g>
      <g transform="translate(180, 380) rotate(5)">
        <path d="M0,0 C-12,-8 -22,-20 -20,-32 C-14,-32 -2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M-20,-32 Q-35,-55 -45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        <path d="M0,0 C12,-8 22,-20 20,-32 C14,-32 2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M20,-32 Q35,-55 45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      </g>
      <g transform="translate(210, 285) rotate(30)">
        <path d="M0,0 C-12,-8 -22,-20 -20,-32 C-14,-32 -2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M-20,-32 Q-35,-55 -45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        <path d="M0,0 C12,-8 22,-20 20,-32 C14,-32 2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M20,-32 Q35,-55 45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      </g>
      <g transform="translate(275, 205) rotate(55)">
        <path d="M0,0 C-12,-8 -22,-20 -20,-32 C-14,-32 -2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M-20,-32 Q-35,-55 -45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        <path d="M0,0 C12,-8 22,-20 20,-32 C14,-32 2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M20,-32 Q35,-55 45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      </g>
      <g transform="translate(365, 145) rotate(75)">
        <path d="M0,0 C-12,-8 -22,-20 -20,-32 C-14,-32 -2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M-20,-32 Q-35,-55 -45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        <path d="M0,0 C12,-8 22,-20 20,-32 C14,-32 2,-20 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M20,-32 Q35,-55 45,-75" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      </g>
      <g transform="translate(460, 110) rotate(95)">
        <path d="M0,0 C-10,-6 -18,-16 -16,-26 C-12,-26 -2,-16 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M-16,-26 Q-30,-45 -40,-65" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        <path d="M0,0 C10,-6 18,-16 16,-26 C12,-26 2,-16 0,0 Z" fill="url(#goldGrad)"/>
        <path d="M16,-26 Q30,-45 40,-65" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      </g>
    </g>

    <!-- Top Crown Star Emblem -->
    <g transform="translate(500, 95)">
      <polygon points="0,-18 5,-5 18,-5 8,4 12,17 0,9 -12,17 -8,4 -18,-5 -5,-5" fill="url(#goldRim)"/>
    </g>

    <!-- LUXURY BOTTOM BANNER / RIBBON -->
    <g id="ribbon-banner" filter="url(#drop)">
      <!-- Ribbon Back Folds -->
      <polygon points="120,680 70,720 120,760 120,720" fill="#064e3b"/>
      <polygon points="880,680 930,720 880,760 880,720" fill="#064e3b"/>

      <polygon points="120,720 180,720 180,760" fill="#043828"/>
      <polygon points="880,720 820,720 820,760" fill="#043828"/>

      <!-- Main Curved Ribbon Plate -->
      <path d="M 140 680 Q 500 640 860 680 L 840 760 Q 500 720 160 760 Z" 
            fill="url(#ribbonGrad)" stroke="url(#goldRim)" stroke-width="4.5"/>
      
      <!-- Gold Inner Ribbon Borders -->
      <path d="M 155 690 Q 500 652 845 690" stroke="#fef08a" stroke-width="1.8" fill="none" opacity="0.8"/>
      <path d="M 172 748 Q 500 710 828 748" stroke="#fef08a" stroke-width="1.8" fill="none" opacity="0.8"/>

      <!-- CANEUP.XYZ Text on Ribbon -->
      <!-- Drop shadow for text -->
      <text x="500" y="736" 
            font-family="'Arial Black', Impact, 'Montserrat', sans-serif" 
            font-size="64" 
            font-weight="900" 
            letter-spacing="5"
            text-anchor="middle"
            fill="#064e3b">CANEUP.XYZ</text>
      <!-- Main Text in Metallic Gold -->
      <text x="500" y="732" 
            font-family="'Arial Black', Impact, 'Montserrat', sans-serif" 
            font-size="64" 
            font-weight="900" 
            letter-spacing="5"
            text-anchor="middle"
            fill="url(#goldText)">CANEUP.XYZ</text>

      <!-- Subtitle Badge Below Ribbon -->
      <rect x="310" y="778" width="380" height="42" rx="21" fill="#15803d" stroke="url(#goldRim)" stroke-width="2.5"/>
      <text x="500" y="806" 
            font-family="'Segoe UI', Roboto, sans-serif" 
            font-size="20" 
            font-weight="800" 
            letter-spacing="3"
            text-anchor="middle"
            fill="#ffffff">गन्ना किसान · HINDI PORTAL</text>
    </g>

  </g>
</svg>