{{ $question := .Get 0 }}
<details style="border:1px solid var(--line);border-radius:10px;padding:0;margin:1rem 0;background:var(--card);overflow:hidden;" itemscope itemtype="https://schema.org/FAQPage">
  <summary style="font-weight:600;font-size:1.05rem;padding:1rem 1.25rem;cursor:pointer;list-style:none;display:flex;align-items:center;gap:.5rem;background:var(--card);transition:background .2s;" onmouseover="this.style.background='var(--raised)'" onmouseout="this.style.background='var(--card)'" itemprop="mainEntity" itemscope itemtype="https://schema.org/Question">
    <span itemprop="name">{{ $question }}</span>
    <span style="margin-left:auto;color:var(--ink-3);font-size:.85rem;transition:transform .2s;">▼</span>
  </summary>
  <div style="padding:1rem 1.25rem;line-height:1.75;color:var(--ink-2);border-top:1px solid var(--line);" itemprop="acceptedAnswer" itemscope itemtype="https://schema.org/Answer">
    <div itemprop="text">{{ .Inner | markdownify }}</div>
  </div>
</details>
