  <button type="button" class="cu-share-fab" id="cuShareFab" aria-label="इस पेज को शेयर करें" title="शेयर करें">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>

</div>

<style>
/* CaneUp Share Buttons — light theme */
.cu-share-float{position:fixed;left:18px;bottom:18px;z-index:99990;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
.cu-share-fab{width:52px;height:52px;border-radius:50%;background:#15803d;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(21,128,61,.4),0 2px 6px rgba(0,0,0,.15);transition:transform .2s}
.cu-share-fab:hover{transform:scale(1.08)}
.cu-share-fab:active{transform:scale(.95)}
.cu-share-fab svg{width:24px;height:24px}
.cu-share-menu{position:absolute;left:0;bottom:62px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.16);min-width:210px;padding:6px;animation:cuMenuIn .18s ease}
@keyframes cuMenuIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cu-share-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:500;color:#111;border-radius:9px;text-align:left;font-family:inherit}
.cu-share-item:hover{background:#f0fdf4}
.cu-ic{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.cu-ic svg{width:17px;height:17px;display:block}
/* Inline share bar (article pages) */
.cu-share-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 2px}
.cu-share-label{font-size:13px;font-weight:700;color:#15803d;margin-right:2px}
.cu-share-btn{width:38px;height:38px;border-radius:50%;border:1px solid #e5e7eb;background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,box-shadow .15s;padding:0}
.cu-share-btn:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.14)}
.cu-share-btn svg{width:19px;height:19px;display:block}
.cu-share-btn[data-net="whatsapp"]{background:#25D366;border-color:#25D366}
.cu-share-btn[data-net="whatsapp"] svg{fill:#fff}
.cu-share-btn[data-net="facebook"]{background:#1877F2;border-color:#1877F2}
.cu-share-btn[data-net="facebook"] svg{fill:#fff}
.cu-share-btn[data-net="x"]{background:#000;border-color:#000}
.cu-share-btn[data-net="x"] svg{fill:#fff}
.cu-share-btn[data-net="telegram"]{background:#229ED9;border-color:#229ED9}
.cu-share-btn[data-net="telegram"] svg{fill:#fff}
.cu-share-btn[data-net="copy"]{background:#fff;border-color:#15803d}
.cu-share-btn[data-net="copy"] svg{stroke:#15803d}
/* Copy toast */
.cu-toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#fff;color:#111;border:1.5px solid #15803d;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:100000;box-shadow:0 8px 24px rgba(0,0,0,.14);animation:cuMenuIn .18s ease;white-space:nowrap}
@media(max-width:640px){
  .cu-share-float{left:14px;bottom:16px}
  .cu-share-fab{width:48px;height:48px}
}
</style>

<script>
(function(){
  function pageData(el){
    var c = el.closest('[data-share-url]');
    return { url: c.getAttribute('data-share-url'), title: c.getAttribute('data-share-title') || document.title };
  }
  function shareUrl(net, url, title){
    var u = encodeURIComponent(url), t = encodeURIComponent(title);
    if(net==='whatsapp') return 'https://wa.me/?text='+t+'%20'+u;
    if(net==='facebook') return 'https://www.facebook.com/sharer/sharer.php?u='+u;
    if(net==='x') return 'https://twitter.com/intent/tweet?text='+t+'&url='+u;
    if(net==='telegram') return 'https://t.me/share/url?url='+u+'&text='+t;
    return null;
  }
  function toast(msg){
    var old = document.querySelector('.cu-toast');
    if(old) old.remove();
    var d = document.createElement('div');
    d.className = 'cu-toast'; d.textContent = msg;
    document.body.appendChild(d);
    setTimeout(function(){ d.remove(); }, 2200);
  }
  function copyLink(url){
    function done(){ toast('लिंक कॉपी हो गया ✓'); }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = url; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(e){ toast('कॉपी नहीं हो पाया'); }
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(fallback);
    } else { fallback(); }
  }
  function hideMenu(){
    var m = document.getElementById('cuShareMenu');
    if(m) m.hidden = true;
  }
  document.addEventListener('click', function(e){
    var netBtn = e.target.closest('[data-net]');
    if(netBtn){
      var d = pageData(netBtn), net = netBtn.getAttribute('data-net');
      if(net === 'copy'){ copyLink(d.url); }
      else {
        var u = shareUrl(net, d.url, d.title);
        if(u) window.open(u, '_blank', 'noopener,width=640,height=560');
      }
      hideMenu();
      return;
    }
    var fab = e.target.closest('#cuShareFab');
    if(fab){
      var d2 = pageData(fab), menu = document.getElementById('cuShareMenu');
      if(navigator.share){
        navigator.share({ title: d2.title, text: d2.title, url: d2.url }).catch(function(){});
      } else if(menu){
        menu.hidden = !menu.hidden;
      }
      return;
    }
    var menu2 = document.getElementById('cuShareMenu');
    if(menu2 && !menu2.hidden && !e.target.closest('#cuShareFloat')){ menu2.hidden = true; }
  });
})();
</script>
