{{ if .IsPage }}
<!-- Article Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "description": "{{ .Description }}",
  "image": "{{ if .Params.featured_image }}{{ .Params.featured_image | absURL }}{{ else }}{{ "/images/og-default.jpg" | absURL }}{{ end }}",
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "author": {
    "@type": "Person",
    "name": "{{ .Params.author_name | default "CaneUp Team" }}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "CaneUp",
    "url": "https://caneup.xyz/",
    "logo": {
      "@type": "ImageObject",
      "url": "https://caneup.xyz/images/logo.png",
      "width": 1200,
      "height": 630
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  },
  "keywords": [{{ range $i, $k := .Params.keywords }}{{ if $i }}, {{ end }}"{{ $k }}"{{ end }}],
  "articleSection": "{{ .Section }}",
  "wordCount": {{ .WordCount }},
  "inLanguage": "hi-IN"
}
</script>

<!-- Breadcrumb Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "https://caneup.xyz/"
    }
    {{ if .Section }},
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ .Section | title }}",
      "item": "https://caneup.xyz/{{ .Section }}/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{ .Title | truncate 50 }}",
      "item": "{{ .Permalink }}"
    }
    {{ end }}
  ]
}
</script>

{{ else }}
<!-- WebSite Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "CaneUp — गन्ना किसान पोर्टल",
  "url": "https://caneup.xyz/",
  "description": "गन्ना पर्ची कैलेंडर, eGanna App, गन्ना भुगतान स्थिति, MSP/FRP रेट, सरकारी योजनाएं",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://caneup.xyz/search/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  },
  "publisher": {
    "@type": "Organization",
    "name": "CaneUp",
    "url": "https://caneup.xyz/",
    "logo": {
      "@type": "ImageObject",
      "url": "https://caneup.xyz/images/logo.png"
    },
    "sameAs": [
      "https://youtube.com/@caneup",
      "https://twitter.com/caneupxyz",
      "https://t.me/caneup"
    ]
  }
}
</script>

<!-- Organization Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "CaneUp",
  "url": "https://caneup.xyz/",
  "logo": "https://caneup.xyz/images/logo.png",
  "sameAs": [
    "https://youtube.com/@caneup",
    "https://twitter.com/caneupxyz",
    "https://t.me/caneup"
  ]
}
</script>

{{ if .IsSection }}
<!-- Breadcrumb Schema for Section -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "https://caneup.xyz/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ .Title }}",
      "item": "{{ .Permalink }}"
    }
  ]
}
</script>
{{ end }}
{{ end }}
